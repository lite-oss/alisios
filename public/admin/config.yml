            collapsed: false
            fields:
              - { label: "Texte eyebrow", name: "hero_eyebrow", widget: "string" }
              - { label: "Titre principal", name: "hero_title", widget: "text", hint: "Utilisez <br> pour les sauts de ligne et <em>mot</em> pour l'italique doré." }
              - { label: "Paragraphe d'introduction", name: "hero_lead", widget: "text" }
              - { label: "Bouton primaire (texte)", name: "hero_btn1", widget: "string" }
