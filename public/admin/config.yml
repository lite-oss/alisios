          - { label: "Citation de mission (bande sombre)", name: "mission_quote", widget: "text" }
          - label: "Section À propos"
            name: "about_group"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Eyebrow", name: "about_eyebrow", widget: "string" }
              - { label: "Titre", name: "about_title", widget: "text" }
              - { label: "Paragraphe 1", name: "about_p1", widget: "text" }
              - { label: "Paragraphe 2", name: "about_p2", widget: "text" }
