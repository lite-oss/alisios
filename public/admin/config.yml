backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ══════════════════════════════════════════════════════════════
  # CONFIGURACIÓN GENERAL
  # ══════════════════════════════════════════════════════════════
  - name: "ajustes"
    label: "⚙️ Ajustes del sitio"
    files:
      - name: "site"
        label: "Configuración general"
        file: "src/_data/site.yaml"
        fields:
          - { label: "Email de contacto",            name: "email",            widget: "string" }
          - { label: "URL de LinkedIn",               name: "linkedin",         widget: "string" }
          - { label: "Nº de países (estadística)",    name: "stat_countries",   widget: "string" }
          - { label: "Nº de idiomas (estadística)",   name: "stat_languages",   widget: "string" }
          - { label: "Ideas (símbolo)",               name: "stat_ideas",       widget: "string" }
          - { label: "Imagen sección Sobre (URL)",    name: "about_image_url",  widget: "string" }
          - { label: "Texto alternativo imagen",      name: "about_image_alt",  widget: "string" }
          - { label: "Año del copyright",             name: "copyright_year",   widget: "string" }

