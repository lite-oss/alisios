              - { label: "Pilier 2 — Texte", name: "p2_text", widget: "text" }
              - { label: "Pilier 3 — Titre", name: "p3_title", widget: "string" }
              - { label: "Pilier 3 — Texte", name: "p3_text", widget: "text" }
              - { label: "Pilier 4 — Titre", name: "p4_title", widget: "string" }
              - { label: "Pilier 4 — Texte", name: "p4_text", widget: "text" }
