            name: "stats_labels_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Étiquette 1", name: "stat1", widget: "string" }
              - { label: "Étiquette 2", name: "stat2", widget: "string" }
              - { label: "Étiquette 3", name: "stat3", widget: "string" }
          - label: "Section Domaines d'action"
            name: "areas_group"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Eyebrow", name: "areas_eyebrow", widget: "string" }
              - { label: "Titre de section", name: "areas_title", widget: "string" }
              - { label: "Domaine 01 — Titre", name: "a1_title", widget: "string" }
              - { label: "Domaine 01 — Texte", name: "a1_text", widget: "text" }
              - { label: "Domaine 02 — Titre", name: "a2_title", widget: "string" }
              - { label: "Domaine 02 — Texte", name: "a2_text", widget: "text" }
              - { label: "Domaine 03 — Titre", name: "a3_title", widget: "string" }
              - { label: "Domaine 03 — Texte", name: "a3_text", widget: "text" }
              - { label: "Domaine 04 — Titre", name: "a4_title", widget: "string" }
              - { label: "Domaine 04 — Texte", name: "a4_text", widget: "text" }
              - { label: "Domaine 05 — Titre", name: "a5_title", widget: "string" }
              - { label: "Domaine 05 — Texte", name: "a5_text", widget: "text" }
              - { label: "Domaine 06 — Titre", name: "a6_title", widget: "string" }
