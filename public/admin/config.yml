            fields:
              - { label: "Eyebrow", name: "collab_eyebrow", widget: "string" }
              - { label: "Titre", name: "collab_title", widget: "string" }
              - { label: "Paragraphe d'introduction", name: "collab_lead", widget: "text" }
              - { label: "Carte 1 — Étiquette", name: "c1_tag", widget: "string" }
              - { label: "Carte 1 — Titre", name: "c1_title", widget: "string" }
              - { label: "Carte 1 — Texte", name: "c1_text", widget: "text" }
              - label: "Carte 1 — Liste des avantages"
                name: "c1_features"
                widget: "list"
                field: { label: "Avantage", name: "item", widget: "string" }
              - { label: "Carte 1 — Bouton (texte)", name: "c1_btn", widget: "string" }
              - { label: "Carte 2 — Étiquette", name: "c2_tag", widget: "string" }
              - { label: "Carte 2 — Titre", name: "c2_title", widget: "string" }
              - { label: "Carte 2 — Texte", name: "c2_text", widget: "text" }
              - label: "Carte 2 — Liste des avantages"
                name: "c2_features"
                widget: "list"
                field: { label: "Avantage", name: "item", widget: "string" }
