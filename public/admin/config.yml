          - label: "Footer"
            name: "footer_group"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Tagline", name: "footer_tagline", widget: "text" }
              - { label: "Colonne 1 — Titre", name: "footer_col1", widget: "string" }
              - { label: "Colonne 2 — Titre", name: "footer_col2", widget: "string" }
              - { label: "Lien: Domaines", name: "footer_areas", widget: "string" }
              - { label: "Lien: Publications", name: "footer_pub", widget: "string" }
              - { label: "Lien: Événements", name: "footer_events", widget: "string" }
              - { label: "Lien: Communauté", name: "footer_community", widget: "string" }
              - { label: "Lien: Abonnement", name: "footer_sub", widget: "string" }
